name: mcpscan
description: Scan an MCP server and upload findings to GitHub Code Scanning via SARIF
author: nadirzhon

inputs:
  server:
    description: MCP server URL, script, or stdio command to scan
    required: true
  fail-on:
    description: Minimum severity that fails the step
    required: false
    default: high
  ai:
    description: Enable optional Claude-assisted analysis
    required: false
    default: "false"
  anthropic-api-key:
    description: Anthropic API key used only when ai=true
    required: false
  version:
    description: mcpscan git tag or ref to install
    required: false
    default: v0.2.0

runs:
  using: composite
  steps:
    - name: Install mcpscan
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "git+https://github.com/nadirzhon/mcpscan.git@${{ inputs.version }}"

    - name: Scan MCP server
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set +e
        AI_ARGS=()
        if [ "${{ inputs.ai }}" = "true" ]; then AI_ARGS+=(--ai); fi
        mcpscan "${{ inputs.server }}" --sarif "${AI_ARGS[@]}" > mcpscan.sarif
        status=$?
        echo "mcpscan_exit_code=$status" >> "$GITHUB_OUTPUT"
        exit $status

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: mcpscan.sarif
        category: mcpscan
