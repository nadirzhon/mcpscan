[project]
name = "mcpscan"
version = "0.1.0"
description = "Security scanner for MCP (Model Context Protocol) servers — detects tool poisoning, over-privileged tools, hidden instructions & injection surfaces."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "nadirzhon" }]
keywords = [
    "mcp", "model-context-protocol", "security", "scanner", "ai-security",
    "tool-poisoning", "prompt-injection", "llm-security", "appsec", "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=2.3",
]

[project.optional-dependencies]
ai = ["anthropic>=0.109"]
dev = ["pytest>=8.0", "ruff>=0.6", "anthropic>=0.109"]

[project.scripts]
mcpscan = "mcpscan.cli:main"

[project.urls]
Homepage = "https://github.com/nadirzhon/mcpscan"
Repository = "https://github.com/nadirzhon/mcpscan"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py310"
