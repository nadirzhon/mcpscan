<text x="360" y="19" fill="#6b7787" text-anchor="middle" font-size="11">mcpscan — MCP security scan</text>
<text x="22" y="46" fill="#f2a93b" font-weight="700" xml:space="preserve">$ uvx mcpscan &quot;npx -y @modelcontextprotocol/server-filesystem /tmp&quot;</text>
<text x="22" y="67" fill="#c9d1d9" font-weight="400" xml:space="preserve"></text>
<text x="22" y="88" fill="#9aa6b4" font-weight="400" xml:space="preserve">  mcpscan — server-filesystem</text>
<text x="22" y="109" fill="#9aa6b4" font-weight="400" xml:space="preserve">  tools: 14  resources: 0  prompts: 0</text>
<text x="22" y="130" fill="#9aa6b4" font-weight="400" xml:space="preserve">  ────────────────────────────────────────────</text>
<text x="22" y="151" fill="#f2a93b" font-weight="400" xml:space="preserve">  🟨 [MEDIUM] Powerful capability: file-write-delete</text>
<text x="22" y="172" fill="#9aa6b4" font-weight="400" xml:space="preserve">     target: write_file · dangerous-capability</text>
<text x="22" y="193" fill="#c9d1d9" font-weight="400" xml:space="preserve">     A prompt-injected instruction could invoke it</text>
<text x="22" y="214" fill="#c9d1d9" font-weight="400" xml:space="preserve">     against the operator&#x27;s intent.</text>
<text x="22" y="235" fill="#c9d1d9" font-weight="400" xml:space="preserve"></text>
<text x="22" y="256" fill="#f2a93b" font-weight="400" xml:space="preserve">  🟨 [MEDIUM] Unconstrained `path` on read_file</text>
<text x="22" y="277" fill="#9aa6b4" font-weight="400" xml:space="preserve">     target: read_file · unconstrained-input</text>
<text x="22" y="298" fill="#c9d1d9" font-weight="400" xml:space="preserve">     Free-form string → path-traversal surface.</text>
<text x="22" y="319" fill="#c9d1d9" font-weight="400" xml:space="preserve"></text>
<text x="22" y="340" fill="#6b7787" font-weight="400" xml:space="preserve">  ⬜ [INFO] Loose schema on 13 tools</text>
<text x="22" y="361" fill="#9aa6b4" font-weight="400" xml:space="preserve">  ────────────────────────────────────────────</text>
<text x="22" y="382" fill="#e6eaf0" font-weight="700" xml:space="preserve">  25 finding(s): 🟨 12 medium  ⬜ 13 info</text>
